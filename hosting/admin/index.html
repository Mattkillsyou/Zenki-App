<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Zenki Dojo — Admin</title>
  <style>
    :root {
      --bg: #0e0f13; --surface: #181a20; --surface2: #21242c; --border: #2c2f38;
      --text: #f4f5f7; --muted: #9aa0ab; --tertiary: #6b7280;
      --red: #e23636; --gold: #e3b23c; --info: #4a90d9; --green: #22c55e;
      --radius: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f8; --surface: #ffffff; --surface2: #f0f1f4; --border: #e2e4e9;
        --text: #14161a; --muted: #5b616e; --tertiary: #8a909c;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; line-height: 1.45;
    }
    button { font-family: inherit; cursor: pointer; }
    .hidden { display: none !important; }

    /* ---- Login ---- */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 32px; width: 100%; max-width: 380px;
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--red); }
    .brand h1 { font-size: 20px; margin: 0; letter-spacing: -0.3px; }
    .login-card p.sub { color: var(--muted); font-size: 13px; margin: 4px 0 22px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); font-size: 15px; font-weight: 600;
    }
    .btn.primary { background: var(--gold); color: #000; border-color: transparent; }
    .btn.danger { background: transparent; color: var(--red); border-color: var(--red); padding: 8px 12px; width: auto; font-size: 13px; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .divider { display: flex; align-items: center; gap: 10px; color: var(--tertiary); font-size: 12px; margin: 18px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .field { margin-bottom: 10px; }
    .field input {
      width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 14px;
    }
    .msg { font-size: 13px; margin-top: 14px; min-height: 18px; }
    .msg.err { color: var(--red); }
    .msg.ok { color: var(--green); }

    /* ---- App shell ---- */
    header.top {
      display: flex; align-items: center; gap: 12px; padding: 14px 20px;
      border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 10;
    }
    header.top .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--red); }
    header.top h1 { font-size: 16px; margin: 0; flex: 1; letter-spacing: -0.2px; }
    header.top .who { color: var(--muted); font-size: 13px; }
    nav.tabs { display: flex; gap: 4px; padding: 12px 20px 0; overflow-x: auto; }
    nav.tabs button {
      padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 600; white-space: nowrap;
    }
    nav.tabs button.active { background: var(--gold); color: #000; border-color: transparent; }
    main { padding: 16px 20px 60px; max-width: 900px; margin: 0 auto; }
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: var(--muted); margin: 6px 0 12px; }

    .row {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px;
    }
    .thumb {
      width: 52px; height: 52px; border-radius: 10px; background: var(--surface2);
      display: flex; align-items: center; justify-content: center; overflow: hidden; flex: 0 0 auto; color: var(--muted); font-size: 20px;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .row .body { flex: 1; min-width: 0; }
    .row .name { font-weight: 700; font-size: 14px; }
    .row .meta { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-word; }
    .row .date { color: var(--tertiary); font-size: 11px; margin-top: 3px; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface2); color: var(--muted); margin-left: 6px; }
    .badge.red { background: rgba(226,54,54,0.15); color: var(--red); }
    .state { text-align: center; color: var(--muted); padding: 40px 16px; }
    .state .big { font-size: 15px; color: var(--text); font-weight: 600; margin-bottom: 4px; }
    .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .toolbar .grow { flex: 1; }
    .refresh { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 10px; padding: 7px 12px; font-size: 13px; }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login" class="login-wrap">
    <div class="login-card">
      <div class="brand"><span class="dot"></span><h1>Zenki Dojo Admin</h1></div>
      <p class="sub">Sign in with an admin account to manage the community.</p>
      <button id="googleBtn" class="btn primary">Sign in with Google</button>
      <div class="divider">or email</div>
      <div class="field"><input id="email" type="email" placeholder="Email" autocomplete="username" /></div>
      <div class="field"><input id="password" type="password" placeholder="Password" autocomplete="current-password" /></div>
      <button id="emailBtn" class="btn">Sign in</button>
      <div id="loginMsg" class="msg"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <header class="top">
      <span class="dot"></span>
      <h1>Zenki Dojo Admin</h1>
      <span id="who" class="who"></span>
      <button id="signOutBtn" class="btn danger">Sign out</button>
    </header>
    <nav class="tabs">
      <button data-tab="posts" class="active">Community</button>
      <button data-tab="reports">Reports</button>
      <button data-tab="members">Members</button>
    </nav>
    <main id="content"></main>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword,
      signOut, onAuthStateChanged,
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getFirestore, collection, query, where, orderBy, limit, getDocs, doc, getDoc,
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // Public web config (safe to expose — security is enforced by Firestore rules).
    const firebaseConfig = {
      apiKey: 'AIzaSyALHuiCPe3wjcKYeqrx90DHcT6bu-Wn_Fo',
      authDomain: 'zenki-dojo.firebaseapp.com',
      projectId: 'zenki-dojo',
      storageBucket: 'zenki-dojo.firebasestorage.app',
      messagingSenderId: '277160279219',
      appId: '1:277160279219:web:4b04763265c86d17a484c6',
    };
    const FN_BASE = 'https://us-central1-zenki-dojo.cloudfunctions.net';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    const loginView = $('login'), appView = $('app'), content = $('content');

    // ---- helpers: DOM built with textContent only (no innerHTML on user data) ----
    function el(tag, props = {}, children = []) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === 'class') n.className = v;
        else if (k === 'text') n.textContent = v;
        else if (k === 'onclick') n.addEventListener('click', v);
        else n.setAttribute(k, v);
      }
      for (const c of [].concat(children)) if (c) n.appendChild(c);
      return n;
    }
    function stateBox(big, small) {
      return el('div', { class: 'state' }, [el('div', { class: 'big', text: big }), el('div', { text: small || '' })]);
    }
    function spinnerBox() { return el('div', { class: 'state' }, [el('span', { class: 'spinner' })]); }
    function fmtDate(v) {
      if (!v) return '';
      const d = new Date(typeof v === 'object' && v.seconds ? v.seconds * 1000 : v);
      return isNaN(d.getTime()) ? '' : d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    }
    function safeImg(url) {
      const wrap = el('div', { class: 'thumb' });
      if (typeof url === 'string' && /^https:\/\//i.test(url)) {
        const img = document.createElement('img');
        img.referrerPolicy = 'no-referrer';
        img.onerror = () => { wrap.textContent = '🖼'; };
        img.src = url;
        wrap.appendChild(img);
      } else {
        wrap.textContent = '📝';
      }
      return wrap;
    }

    // ---- auth ----
    $('googleBtn').addEventListener('click', async () => {
      setLoginMsg('');
      try { await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch (e) { setLoginMsg(authErr(e), true); }
    });
    $('emailBtn').addEventListener('click', async () => {
      setLoginMsg('');
      const email = $('email').value.trim(), pw = $('password').value;
      if (!email || !pw) { setLoginMsg('Enter email and password.', true); return; }
      try { await signInWithEmailAndPassword(auth, email, pw); }
      catch (e) { setLoginMsg(authErr(e), true); }
    });
    $('signOutBtn').addEventListener('click', () => signOut(auth));
    function setLoginMsg(t, err) { const m = $('loginMsg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); }
    function authErr(e) {
      const c = e && e.code || '';
      if (c.includes('popup-closed') || c.includes('cancelled-popup')) return 'Sign-in cancelled.';
      if (c.includes('wrong-password') || c.includes('invalid-credential') || c.includes('user-not-found')) return 'Wrong email or password.';
      if (c.includes('popup-blocked')) return 'Popup blocked — allow popups and retry.';
      return (e && e.message) || 'Sign-in failed.';
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { appView.classList.add('hidden'); loginView.classList.remove('hidden'); return; }
      // Admin gate: /admins/{uid} must exist. A user may read their OWN admin doc
      // (rule: isAdmin() || isOwner(uid)), so this check is permitted for anyone.
      let adminSnap;
      try { adminSnap = await getDoc(doc(db, 'admins', user.uid)); }
      catch (e) {
        // A transient read/network error must NOT masquerade as "not an admin"
        // and sign a legitimate admin out — leave the session so a reload retries.
        setLoginMsg('Could not verify admin access — check your connection and reload.', true);
        return;
      }
      if (!adminSnap.exists()) {
        setLoginMsg('That account is not an admin.', true);
        await signOut(auth);
        return;
      }
      $('who').textContent = user.email || user.uid;
      loginView.classList.add('hidden');
      appView.classList.remove('hidden');
      renderTab(currentTab);
    });

    // ---- tabs ----
    let currentTab = 'posts';
    document.querySelectorAll('nav.tabs button').forEach((b) => {
      b.addEventListener('click', () => {
        document.querySelectorAll('nav.tabs button').forEach((x) => x.classList.remove('active'));
        b.classList.add('active');
        currentTab = b.dataset.tab;
        renderTab(currentTab);
      });
    });
    function renderTab(tab) {
      if (tab === 'posts') return renderPosts();
      if (tab === 'reports') return renderReports();
      if (tab === 'members') return renderMembers();
    }

    // ---- Posts ----
    async function renderPosts() {
      content.replaceChildren(spinnerBox());
      let posts = [], capped = false;
      try {
        const snap = await getDocs(query(collection(db, 'posts'), orderBy('createdAt', 'desc'), limit(200)));
        capped = snap.size === 200;
        posts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      } catch (e) {
        content.replaceChildren(stateBox('Could not load posts', (e && e.message) || String(e)));
        return;
      }
      let remaining = posts.length;
      const labelText = () => `${remaining} POST${remaining === 1 ? '' : 'S'}${capped ? ' (newest 200 shown)' : ''} · newest first`;
      const label = el('div', { class: 'section-label grow', text: labelText() });
      const frame = el('div');
      frame.appendChild(el('div', { class: 'toolbar' }, [
        label,
        el('button', { class: 'refresh', text: 'Refresh', onclick: renderPosts }),
      ]));
      if (posts.length === 0) { frame.appendChild(stateBox('No posts', 'The community feed is empty.')); content.replaceChildren(frame); return; }
      const onDeleted = () => { remaining = Math.max(0, remaining - 1); label.textContent = labelText(); };
      for (const p of posts) frame.appendChild(postRow(p, onDeleted));
      content.replaceChildren(frame);
    }
    function postRow(p, onDeleted) {
      const row = el('div', { class: 'row' });
      row.appendChild(safeImg(p.mediaType === 'photo' ? p.mediaUrl : null));
      const caption = (p.caption || '').trim();
      const kind = p.mediaType === 'video' ? 'Video post' : p.mediaType === 'photo' ? 'Photo post' : 'Text post';
      const body = el('div', { class: 'body' }, [
        el('div', { class: 'name', text: p.displayName || 'Member' }),
        el('div', { class: 'meta', text: caption || kind }),
        el('div', { class: 'date', text: fmtDate(p.createdAt) }),
      ]);
      row.appendChild(body);
      const delBtn = el('button', { class: 'btn danger', text: 'Delete' });
      delBtn.addEventListener('click', async () => {
        if (!confirm(`Delete this post by ${p.displayName || 'Member'}? Removes the post, its comments, likes, and any media. This cannot be undone.`)) return;
        delBtn.disabled = true; delBtn.textContent = 'Deleting…';
        const res = await callFn('deletePostCascade', { postId: p.id });
        if (res.ok) { row.remove(); if (onDeleted) onDeleted(); }
        else { delBtn.disabled = false; delBtn.textContent = 'Delete'; alert('Delete failed: ' + (res.error || 'unknown')); }
      });
      row.appendChild(delBtn);
      return row;
    }

    // ---- Reports ----
    async function renderReports() {
      content.replaceChildren(spinnerBox());
      let reports = [];
      try {
        const snap = await getDocs(query(collection(db, 'reports'), where('status', '==', 'open'), orderBy('createdAt', 'desc')));
        reports = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      } catch (e) {
        content.replaceChildren(stateBox('Could not load reports', (e && e.message) || String(e)));
        return;
      }
      const frame = el('div', {}, [el('div', { class: 'section-label', text: `${reports.length} OPEN REPORT${reports.length === 1 ? '' : 'S'}` })]);
      if (reports.length === 0) { frame.appendChild(stateBox('All clear', 'No open reports.')); content.replaceChildren(frame); return; }
      for (const r of reports) {
        const row = el('div', { class: 'row' }, [
          el('div', { class: 'thumb', text: '🚩' }),
          el('div', { class: 'body' }, [
            (() => { const n = el('div', { class: 'name' }); n.appendChild(document.createTextNode(String(r.targetType || 'item'))); n.appendChild(el('span', { class: 'badge red', text: r.reason || 'reported' })); return n; })(),
            el('div', { class: 'meta', text: (r.context && String(r.context).trim()) || 'No extra detail.' }),
            el('div', { class: 'date', text: fmtDate(r.createdAt) }),
          ]),
        ]);
        frame.appendChild(row);
      }
      content.replaceChildren(frame);
    }

    // ---- Members ----
    async function renderMembers() {
      content.replaceChildren(spinnerBox());
      let members = [];
      try {
        const snap = await getDocs(query(collection(db, 'members'), limit(500)));
        members = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      } catch (e) {
        content.replaceChildren(stateBox('Could not load members', (e && e.message) || String(e)));
        return;
      }
      members.sort((a, b) => String(a.firstName || a.name || '').localeCompare(String(b.firstName || b.name || '')));
      const frame = el('div', {}, [el('div', { class: 'section-label', text: `${members.length} MEMBER${members.length === 1 ? '' : 'S'}` })]);
      for (const m of members) {
        const name = [m.firstName, m.lastName].filter(Boolean).join(' ') || m.name || m.displayName || '(no name)';
        const bits = [m.email, m.belt ? `${m.belt} belt` : null, m.isAdmin ? 'admin' : m.isEmployee ? 'staff' : null].filter(Boolean).join(' · ');
        frame.appendChild(el('div', { class: 'row' }, [
          safeImg(m.profilePhoto || m.avatar),
          el('div', { class: 'body' }, [
            el('div', { class: 'name', text: name }),
            el('div', { class: 'meta', text: bits || '—' }),
          ]),
        ]));
      }
      content.replaceChildren(frame);
    }

    // ---- Cloud Function call (Bearer ID token) ----
    async function callFn(name, body) {
      const user = auth.currentUser;
      if (!user) return { ok: false, error: 'not-signed-in' };
      try {
        const token = await user.getIdToken();
        const res = await fetch(`${FN_BASE}/${name}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) return { ok: false, error: data.error || `http-${res.status}` };
        return { ok: true, data };
      } catch (e) {
        return { ok: false, error: (e && e.message) || 'network-error' };
      }
    }
  </script>
</body>
</html>
