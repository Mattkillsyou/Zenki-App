<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Zenki Dojo — Admin</title>
  <style>
    :root {
      --bg: #0e0f13; --surface: #181a20; --surface2: #21242c; --border: #2c2f38;
      --text: #f4f5f7; --muted: #9aa0ab; --tertiary: #6b7280;
      --red: #e23636; --gold: #e3b23c; --info: #4a90d9; --green: #22c55e;
      --radius: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f8; --surface: #ffffff; --surface2: #f0f1f4; --border: #e2e4e9;
        --text: #14161a; --muted: #5b616e; --tertiary: #8a909c;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; line-height: 1.45;
    }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; width: 100%; max-width: 380px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--red); }
    .brand h1 { font-size: 20px; margin: 0; letter-spacing: -0.3px; }
    .login-card p.sub { color: var(--muted); font-size: 13px; margin: 4px 0 22px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 15px; font-weight: 600; }
    .btn.primary { background: var(--gold); color: #000; border-color: transparent; }
    .btn.danger { background: transparent; color: var(--red); border-color: var(--red); padding: 8px 12px; width: auto; font-size: 13px; }
    .btn.small { width: auto; padding: 8px 14px; font-size: 13px; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .divider { display: flex; align-items: center; gap: 10px; color: var(--tertiary); font-size: 12px; margin: 18px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .field { margin-bottom: 10px; }
    label.fl { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 5px; }
    input, textarea, select { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
    textarea { min-height: 90px; resize: vertical; }
    .msg { font-size: 13px; margin-top: 14px; min-height: 18px; }
    .msg.err { color: var(--red); } .msg.ok { color: var(--green); }

    header.top { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 10; }
    header.top .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--red); }
    header.top h1 { font-size: 16px; margin: 0; flex: 1; letter-spacing: -0.2px; }
    header.top .who { color: var(--muted); font-size: 13px; }
    nav.tabs { display: flex; gap: 4px; padding: 12px 20px 0; overflow-x: auto; }
    nav.tabs button { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 600; white-space: nowrap; }
    nav.tabs button.active { background: var(--gold); color: #000; border-color: transparent; }
    main { padding: 16px 20px 60px; max-width: 900px; margin: 0 auto; }
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: var(--muted); margin: 6px 0 12px; }

    .row { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
    .row.stack { align-items: flex-start; }
    .thumb { width: 52px; height: 52px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; overflow: hidden; flex: 0 0 auto; color: var(--muted); font-size: 20px; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .row .body { flex: 1; min-width: 0; }
    .row .name { font-weight: 700; font-size: 14px; }
    .row .meta { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-word; }
    .row .date { color: var(--tertiary); font-size: 11px; margin-top: 3px; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface2); color: var(--muted); margin-left: 6px; }
    .badge.red { background: rgba(226,54,54,0.15); color: var(--red); }
    .badge.gold { background: rgba(227,178,60,0.18); color: var(--gold); }
    .badge.green { background: rgba(34,197,94,0.15); color: var(--green); }
    .state { text-align: center; color: var(--muted); padding: 40px 16px; }
    .state .big { font-size: 15px; color: var(--text); font-weight: 600; margin-bottom: 4px; }
    .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .toolbar .grow { flex: 1; min-width: 140px; }
    .toolbar input.search { flex: 2; min-width: 180px; width: auto; padding: 8px 12px; font-size: 13px; }
    .refresh { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 10px; padding: 7px 12px; font-size: 13px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .rowbtns { display: flex; gap: 6px; flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; }
    .iconbtn { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--text); }
    .charcount { font-size: 11px; color: var(--tertiary); text-align: right; margin-top: 4px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--muted); margin: 8px 0; }
    .checkrow { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
    .checkrow input { width: auto; }
    .report-preview { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--muted); margin-top: 6px; word-break: break-word; }

    /* Utility — el() blocks inline style attributes (DANGEROUS_ATTRS), so
       spacing must come from a class. */
    .mt8 { margin-top: 8px; }

    /* Member detail / trainer stats view */
    .backbtn { background: transparent; border: none; color: var(--muted); font-size: 14px; font-weight: 600; padding: 6px 0; margin-bottom: 4px; }
    .backbtn:hover { color: var(--text); }
    .detail-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .detail-head .who-name { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
    .detail-head .who-meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .stat .v { font-size: 24px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1; }
    .stat .k { font-size: 10px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted); margin-top: 5px; text-transform: uppercase; }
    .stat .sub { font-size: 11px; color: var(--tertiary); margin-top: 3px; }
    .belt-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 7px; vertical-align: middle; border: 1px solid var(--border); }
    /* Day-of-week histogram — hand-built (no chart lib is reachable: no bundler, no CDN). */
    .dow { display: flex; align-items: flex-end; gap: 6px; height: 84px; margin-top: 10px; }
    .dow .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 5px; }
    /* The bar needs its own flexible track: sized directly in the column it was
       subject to flex-shrink, which flattened every day at >=~55% of the max to
       an identical height — the chart stopped discriminating exactly where it
       mattered. The track absorbs the leftover space; the bar never shrinks. */
    .dow .track { flex: 1; width: 100%; display: flex; align-items: flex-end; }
    .dow .bar { width: 100%; background: var(--gold); border-radius: 4px 4px 0 0; min-height: 2px; flex: 0 0 auto; }
    .dow .lbl { font-size: 10px; color: var(--muted); font-weight: 600; }
    .dow .n { font-size: 10px; color: var(--tertiary); }
    .note { font-size: 11px; color: var(--tertiary); margin-top: 8px; }
  </style>
</head>
<body>
  <div id="login" class="login-wrap">
    <div class="login-card">
      <div class="brand"><span class="dot"></span><h1>Zenki Dojo Admin</h1></div>
      <p class="sub">Sign in with an admin account to manage the community.</p>
      <button id="googleBtn" class="btn primary">Sign in with Google</button>
      <div class="divider">or email</div>
      <form id="emailForm">
        <div class="field"><input id="email" type="email" placeholder="Email" autocomplete="username" /></div>
        <div class="field"><input id="password" type="password" placeholder="Password" autocomplete="current-password" /></div>
        <button id="emailBtn" class="btn" type="submit">Sign in</button>
      </form>
      <div id="loginMsg" class="msg"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <span class="dot"></span>
      <h1>Zenki Dojo Admin</h1>
      <span id="who" class="who"></span>
      <button id="signOutBtn" class="btn danger">Sign out</button>
    </header>
    <nav class="tabs">
      <button data-tab="posts" class="active">Community</button>
      <button data-tab="reports">Reports</button>
      <button data-tab="members">Members</button>
      <button data-tab="announcements">Announcements</button>
      <button data-tab="broadcast">Broadcast</button>
      <button data-tab="support">Support</button>
    </nav>
    <main id="content"></main>
  </div>

  <script type="module" src="/admin/app.js"></script>
</body>
</html>
